# Railway config for the outreach worker service.
#
# STEADY STATE = the always-on `tick-loop` daemon (owner request 2026-08-10). The service runs
# `python -m api.scripts.run_market tick-loop <market>` continuously (OUTREACH_COMMAND=tick-loop,
# no cronSchedule), looping `tick` every few seconds so a UI-placed order (enrich / scan) drains
# within seconds instead of waiting for a cron (Railway's cron floor is 5 minutes). The daemon
# swallows per-iteration errors and stops cleanly on SIGTERM, so a deploy never severs a drain.
#
# restartPolicyType = "on_failure": restart the daemon if it CRASHES (OOM / SIGKILL), so the worker
# self-heals; a clean SIGTERM exit during a deploy returns 0 and is NOT restarted (the new
# deployment takes over). This replaces the old "never" (correct when this was a one-shot cron job).
#
# CAVEAT — do NOT repurpose this service for a manual PAID one-shot (ingest / run / scan). Under
# "on_failure" a paid pull that fails would restart and re-pull (the loop the old "never" guarded).
# Run those via the local CLI or a separate ephemeral job, never by flipping this daemon's
# OUTREACH_COMMAND. The steady state here is tick-loop, whose restart is harmless (it just resumes
# draining — spend stays authorized per signed order row).
#
# The start command + cron schedule are set on the Railway service (dashboard) via OUTREACH_COMMAND
# and cronSchedule=null, not pinned here, matching how this service has always been configured.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
